<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpaceCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* SpaceCore, Mission One: Mars. One-screen game: HUD bar, side view of the shared Mars world, tool tray. Hosted by app/(site)/create/spacecore via components/SpaceCoreGame.js. */
:root{
  --bg:#0A0B1C; --panel:#111330; --line:#262A55; --line2:#3A3E75;
  --lav:#B9C0FF; --lav2:#8B95F6; --warm:#E8CFC0; --muted:#8A8FBF; --dim:#565B8F; --text:#DCDFFF; --rust:#C97B6E;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lav2);outline-offset:2px}
a{color:var(--lav)}
.mono{font-family:var(--mono)}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-style:italic;font-weight:600;font-size:22px;color:var(--warm)}
.brand span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.res{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;background:var(--panel);transition:border-color .2s}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip.bump{border-color:var(--warm)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--line2);border-radius:4px;color:var(--lav);font-family:var(--mono);font-size:12px;padding:6px 12px;letter-spacing:.3px}
.btn:hover{border-color:var(--lav2);background:rgba(139,149,246,.08)}
.btn.primary{border-color:var(--warm);color:var(--warm)}
.btn.primary:hover{background:rgba(232,207,192,.1)}
.btn.on{background:rgba(139,149,246,.16);border-color:var(--lav2);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:3px 8px;font-size:11px}
#stage{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#06060f}
#cv{display:block;width:100%;height:100%;touch-action:none}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.modes{display:flex;gap:4px}
.palette{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.pitem{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:left}
.pitem b{font-weight:500;font-size:12px}
.pitem small{font-family:var(--mono);font-size:10px;color:var(--muted)}
.pitem.sel{border-color:var(--warm);background:rgba(232,207,192,.08)}
.pitem.poor small{color:var(--rust)}
.status{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.status em{font-style:normal;color:var(--warm)}
#toasts{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;max-width:min(380px,calc(100% - 24px))}
.toast{background:rgba(10,11,28,.88);border:1px solid var(--line2);border-radius:4px;padding:7px 11px;font-family:var(--mono);font-size:12px;color:var(--text);transition:opacity .5s}
.toast.big{border-color:var(--warm);color:var(--warm)}
#dpad{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
#dpad button{background:rgba(17,19,48,.8);border:1px solid var(--line2);border-radius:6px;color:var(--lav);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
#dpad button:active{background:rgba(139,149,246,.25)}
@media (hover:hover) and (pointer:fine) and (min-width:760px){#dpad{display:none}}

/* Lyra on comms */
#lyra{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px;max-width:min(430px,calc(100% - 190px));pointer-events:none}
@media (hover:hover) and (pointer:fine) and (min-width:760px){#lyra{max-width:min(460px,calc(100% - 24px))}}
#lyra > *{pointer-events:auto}
.orb{width:52px;height:52px;flex:0 0 52px;border:none;background:none;padding:0;border-radius:50%}
.orb svg{width:100%;height:100%;overflow:visible}
.orb .halo{transition:opacity .4s}
#lyra.speaking .orb .ring{animation:spin 6s linear infinite;transform-origin:26px 26px}
#lyra.speaking .orb .halo{opacity:.9}
#lyra.celebrate .orb .halo{fill:rgba(232,207,192,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.lyra-body{background:rgba(10,11,28,.93);border:1px solid var(--lav2);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.lyra-name{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--lav2);display:flex;justify-content:space-between;gap:8px}
.lyra-text{font-size:13px;line-height:1.5;color:var(--text);min-height:1.5em}
.lyra-text a{color:var(--warm)}
.lyra-mission{font-family:var(--mono);font-size:11px;color:var(--warm);line-height:1.45}
.lyra-row{display:flex;flex-wrap:wrap;gap:5px}
#lyraAsk{display:flex;gap:5px}
#lyraAsk input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:4px;color:var(--text);font:inherit;font-size:12px;padding:6px 8px}
#lyra.min .lyra-body{display:none}
@media (prefers-reduced-motion:reduce){#lyra.speaking .orb .ring{animation:none}.toast{transition:none}}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{background:rgba(12,13,32,.9);border:1px solid var(--line2);border-radius:4px;padding:22px;max-width:660px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{font-family:var(--display);font-style:italic;font-weight:600;margin:0;color:var(--warm);text-wrap:balance}
.card h1{font-size:clamp(34px,6vw,54px);line-height:1}
.card h2{font-size:26px}
.card p{margin:0;line-height:1.6;max-width:62ch}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--lav2);margin:0}
.fine{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.acard{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:6px;min-width:0}
.acard .an{font-family:var(--display);font-style:italic;font-size:17px}
.acard .ae{font-size:12px;color:var(--muted);line-height:1.4}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:14px;height:6px;border-radius:1px;background:var(--line)}
.pips i.f{background:var(--lav2)}
.pips i.p{background:var(--warm)}
.pm{display:flex;align-items:center;gap:6px;justify-content:space-between}
.pm button{width:28px;height:26px;border:1px solid var(--line2);background:none;border-radius:3px;color:var(--lav)}
.pm span{font-family:var(--mono);font-size:12px;color:var(--muted)}
#dash{position:absolute;top:0;right:0;bottom:0;width:min(450px,100%);background:rgba(12,13,32,.97);border-left:1px solid var(--line2);overflow:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px;z-index:5}
#dash h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:26px;margin:0;color:var(--warm)}
#dash h3{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--lav2);margin:0 0 8px}
#dash section{display:flex;flex-direction:column;gap:6px}
#dash p{margin:0;line-height:1.5;font-size:13px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meter{height:6px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lav2)}
.meter.warm i{background:var(--warm)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.kv .lbl{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.5}
.small{font-size:12px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);border-radius:3px;padding:1px 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.mlist{display:flex;flex-direction:column;gap:5px}
.mitem{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:12.5px;line-height:1.4}
.mitem .ck{font-family:var(--mono);color:var(--dim)}
.mitem.done{color:var(--muted)}
.mitem.done .ck{color:var(--ok,#9CCB98)}
.mitem.cur{color:var(--warm)}
@media (max-width:560px){.brand span{display:none}.card{padding:16px}#lyra{max-width:calc(100% - 24px);bottom:auto;top:12px}#toasts{top:auto;bottom:170px}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>SpaceCore</b><span class="mono">Mission One · Mars · Alpha</span></div>
    <div id="res" class="res" aria-live="polite"></div>
    <div class="actions">
      <button id="btnDash" class="btn" type="button">Dashboard</button>
      <button id="btnFull" class="btn" type="button">Fullscreen</button>
      <button id="btnSound" class="btn" type="button">Sound on</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv" aria-label="Side view of Mars: the colony on the surface and the tunnels Kin have dug"></canvas>
    <div id="toasts"></div>
    <div id="dpad" hidden>
      <span></span><button type="button" data-d="up" aria-label="Up">▲</button><span></span>
      <button type="button" data-d="left" aria-label="Left">◀</button><span></span><button type="button" data-d="right" aria-label="Right">▶</button>
      <span></span><button type="button" data-d="down" aria-label="Down">▼</button><span></span>
    </div>
    <div id="lyra" hidden>
      <button id="lyraOrb" class="orb" type="button" aria-label="Show or hide Lyra">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle class="halo" cx="26" cy="26" r="24" fill="rgba(139,149,246,.18)" opacity=".5"/>
          <g class="ring"><circle cx="26" cy="26" r="17" fill="none" stroke="#B9C0FF" stroke-width="2" stroke-dasharray="80 10 4 10"/></g>
          <circle cx="26" cy="26" r="11" fill="#14163A" stroke="#8B95F6" stroke-width="1"/>
          <circle id="lyraPupil" cx="26" cy="26" r="4.5" fill="#DCDFFF"/>
        </svg>
      </button>
      <div class="lyra-body">
        <div class="lyra-name"><span>LYRA · COMMS</span><span id="lyraCount"></span></div>
        <div id="lyraText" class="lyra-text"></div>
        <div id="lyraMission" class="lyra-mission"></div>
        <div class="lyra-row">
          <button id="lyraNext" class="btn sm" type="button">Got it</button>
          <button id="lyraScan" class="btn sm" type="button">Scan (Q)</button>
          <button id="lyraAskBtn" class="btn sm" type="button">Ask Lyra</button>
        </div>
        <form id="lyraAsk" hidden><input id="lyraQ" maxlength="400" placeholder="Ask about SpaceCore, Mars or 13i" autocomplete="off"><button class="btn sm" type="submit">Send</button></form>
      </div>
    </div>
    <div id="intro" class="overlay"></div>
    <aside id="dash" hidden></aside>
  </main>
  <footer class="tools" id="tools" hidden>
    <div class="modes">
      <button type="button" class="btn on" id="mDig">Dig</button>
      <button type="button" class="btn" id="mBuild">Build (B)</button>
    </div>
    <div id="palette" class="palette" hidden></div>
    <div id="status" class="status"></div>
  </footer>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const dk = document.createElement('canvas'), dctx = dk.getContext('2d');
const GAME = 'spacecore';
const inFrame = window.parent && window.parent !== window;
const post = msg => { try { if (inFrame) window.parent.postMessage(Object.assign({ source: GAME }, msg), window.location.origin); } catch (e) {} };

// ---------- world constants ----------
const W = 128, H = 96, GY = 10;            // GY = first rock row; row GY-1 is the surface you drive on
const LANDER_X = 60, SPAWN_X = 63;
const TIME_SCALE = 6;                       // Mars minutes per real minute (Alpha)
const AIR=0, TUN=1, REG=2, BAS=3, ICE=4, MET=5, BED=6, WALL=10, GLASS=11, LOCK=12, O2=13, GREEN=14, LAMP=15, RIG=16;
const RES = ['iron','silicon','ice','rare','food'];
const RNAME = {iron:'Iron', silicon:'Silicon', ice:'Ice', rare:'Rare metals', food:'Food'};
const RCOL = {iron:'#C97B6E', silicon:'#AEB4D8', ice:'#A7CFE0', rare:'#E2C27A', food:'#9CCB98'};
const ROCKRES = {[REG]:'iron', [BAS]:'silicon', [ICE]:'ice', [MET]:'rare'};
const HARD = {[REG]:.38, [BAS]:.6, [ICE]:.5, [MET]:.95};
const ATTRS = [
  {k:'eng', n:'Engineering', e:'Drill speed +12% per point.'},
  {k:'geo', n:'Geology', e:'More by-products and rare finds.'},
  {k:'end', n:'Endurance', e:'Auto-drills hold 3 more hours per point.'},
  {k:'nav', n:'Navigation', e:'Your scanner sees ice and metal veins further away.'},
  {k:'fab', n:'Fabrication', e:'Building costs 6% less per point.'},
  {k:'spirit', n:'Crew Spirit', e:'Your Great Work contributions count 10% more per point.'},
];
const BUILD = [
  {id:'wall', tile:WALL, n:'Hull wall', cost:{iron:2}, d:'Seals a room.'},
  {id:'glass', tile:GLASS, n:'Glass', cost:{silicon:2}, d:'Seals a room and lets light through.'},
  {id:'lock', tile:LOCK, n:'Airlock', cost:{iron:3, silicon:2}, d:'Seals a room but lets you pass.'},
  {id:'o2', tile:O2, n:'O₂ pump', cost:{iron:5, silicon:3, ice:3}, d:'Pressurizes a sealed room.'},
  {id:'green', tile:GREEN, n:'Greenhouse', cost:{iron:3, silicon:5, ice:4}, d:'Grows food in a pressurized room.'},
  {id:'lamp', tile:LAMP, n:'Lamp', cost:{iron:1, silicon:1}, d:'Lights the dark.'},
  {id:'rig', tile:RIG, n:'Auto-drill', cost:{iron:8, silicon:4}, d:'Must touch rock. Mines while you are away.'},
  {id:'remove', tile:-1, n:'Remove', cost:{}, d:'Take back one of your blocks for half its cost.'},
];
// Must match lib/spacecore.js and spacecore_needs() in docs/v5.39-spacecore.sql
const STAGES = [
  {n:'Landing Base', x:66, need:{iron:800, silicon:500, ice:200, rare:0}, pat:[
    "......####......","....########....","..##ww####ww##..","..############..",
    "################","#ww##########ww#","################","#..#........#..#"]},
  {n:'Habitat Dome', x:76, need:{iron:2000, silicon:1600, ice:800, rare:40}, pat:[
    ".....dddddd.....","...dddddddddd...","..dddddddddddd..",".dddddddddddddd.",
    ".dddddddddddddd.","################","#ww##ww##ww##ww#","################"]},
  {n:'Greenhouse Ring', x:50, need:{iron:1800, silicon:2400, ice:1500, rare:40}, pat:[
    "..gggg..gggg..",".gggggggggggg.","gggggggggggggg","##############","#ww########ww#","##############"]},
  {n:'Oxygen Plant', x:86, need:{iron:2800, silicon:1800, ice:2400, rare:80}, pat:[
    "..pp......","..pp..pp..","..pp..pp..","##########","#rr####rr#","##########","#ww####ww#","##########"]},
  {n:'Launch Facility', x:93, need:{iron:5000, silicon:4000, ice:2000, rare:300}, pat:[
    "......r.....",".....###....",".....#w#..p.",".....###..p.",".....###..p.",".....###..p.",
    "....#####.p.","....#####.p.","....##w##.p.","....#####.p.","....#####.p.","...#######p.",
    "...##...##p.","############","#ww######ww#","############"]},
];
STAGES.forEach(st => {
  st.cells = [];
  for (let r = st.pat.length - 1; r >= 0; r--) for (let c = 0; c < st.pat[r].length; c++)
    if (st.pat[r][c] !== '.') st.cells.push({r, c, ch: st.pat[r][c]});
});

// ---------- helpers ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtH = min => { min=Math.max(0,min); const h=Math.floor(min/60), m=Math.floor(min%60); return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`; };
const fmtReal = ms => fmtH(ms/60000);
const today = () => new Date().toISOString().slice(0,10);
const sum = o => Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
const mdLinks = s => esc(s).replace(/\[([^\]]+)\]\((\/[^)\s]*)\)/g,'<a href="$2" target="_top">$1</a>');

// ---------- the shared world ----------
let world, own = new Uint16Array(W*H), seen = new Uint8Array(W*H), press = new Uint8Array(W*H);
let ownerNames = [];                       // own[i]: 0 = nobody, 1 = me, n>=2 = ownerNames[n-2]
const idx=(x,y)=>y*W+x;
const tile=(x,y)=> (x<0||y<0||x>=W||y>=H) ? BED : world[idx(x,y)];
function genWorld(){
  const r = mulberry32(1306), w = new Uint8Array(W*H);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    let t;
    if (y<GY) t=AIR;
    else { const d=y-GY; t = d<12 ? REG : d<17 ? (r()<(d-11)/6?BAS:REG) : BAS; }
    if (y>=GY && (x===0||x===W-1||y>=H-2)) t=BED;
    w[idx(x,y)]=t;
  }
  function blob(type,n,dmin,dmax,smin,smax){
    for(let i=0;i<n;i++){
      let x=2+Math.floor(r()*(W-4)), y=GY+dmin+Math.floor(r()*(dmax-dmin));
      const len=smin+Math.floor(r()*(smax-smin));
      for(let k=0;k<len;k++){
        if(x>0&&x<W-1&&y>GY&&y<H-2) w[idx(x,y)]=type;
        const d=Math.floor(r()*4); x+=[1,-1,0,0][d]; y+=[0,0,1,-1][d];
      }
    }
  }
  blob(BAS,20,2,12,3,8);
  blob(REG,28,16,60,3,7);
  blob(ICE,44,5,42,4,11);
  blob(MET,52,24,92,2,6);
  blob(MET,16,12,26,1,3);
  return w;
}
world = genWorld();
const passable=(x,y)=>{const t=tile(x,y); if(t===AIR) return y===GY-1; return t===TUN||t===LOCK||t>=O2;};
const diggable=t=>t>=REG&&t<=MET;
const interior=t=>t===TUN||t>=O2;
function applyTiles(list, skipMine){
  let changed=false;
  for(const [x,y,t,o] of list){
    if(x<0||y<0||x>=W||y>=H) continue;
    const i=idx(x,y);
    if(skipMine && own[i]===1) continue;
    if(skipMine && o===1) continue;
    if(pending.has(i)) continue;
    world[i]=t; own[i]=o||0; changed=true;
  }
  if(changed){ recomputePressure(); validateRigs(); }
}
function recomputePressure(){
  press.fill(0);
  const vis=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++){
    if(world[i]!==O2||vis[i]) continue;
    const q=[i], cells=[]; vis[i]=1; let sealed=true;
    while(q.length){
      const c=q.pop(); cells.push(c);
      if(cells.length>420){sealed=false;break;}
      const x=c%W, y=(c/W)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy, t=tile(nx,ny);
        if(t===AIR){sealed=false;continue;}
        const ni=idx(nx,ny);
        if(interior(t)&&!vis[ni]){vis[ni]=1;q.push(ni);}
      }
    }
    if(sealed) for(const c of cells) press[c]=1;
  }
}

// ---------- Lyra on comms ----------
const lyraEl=$('#lyra'), lyraText=$('#lyraText');

function lyra(text,{prio=1,hold=false,celebrate=false,key=null,cool=0}={}){
  if(key){ const t=lyraCool[key]; if(t&&Date.now()-t<cool*1000) return; lyraCool[key]=Date.now(); }
  if(lyraQ.some(m=>m.text===text)||(lyraCur&&lyraCur.text===text)) return;
  if(prio<=1&&lyraQ.length>=2) return;              // small talk waits for a quieter moment
  lyraQ.push({text,prio,hold,celebrate}); lyraQ.sort((a,b)=>b.prio-a.prio);

function tickLyra(dt){

  if(lyraType<lyraCur.text.length){ lyraType = reduce ? lyraCur.text.length : Math.min(lyraCur.text.length, lyraType+dt*70); const shown=lyraCur.text.slice(0,Math.floor(lyraType)); lyraText.innerHTML = lyraType>=lyraCur.text.length ? mdLinks(lyraCur.text) : esc(shown); }

let missionBriefing=null;

function dailyCall(announce){

// ---------- economy ----------
function allBoosts(){ const now=Date.now(); return siteBoosts.concat(S.boosts).filter(b=>b.until>now); }
function boostPct(){ return Math.min(.5, allBoosts().reduce((a,b)=>a+b.pct,0)); }
function stage(){ return STAGES[C.stage]; }
function stageProgress(){ const st=stage(); if(!st) return 1; let a=0,b=0; for(const r in st.need){ a+=Math.min(+C.have[r]||0,st.need[r]); b+=st.need[r]; } return b?a/b:1; }
function scarce(){ const st=stage(); if(!st) return null; let best=null,bv=0; for(const r of ['iron','silicon','ice','rare']){ const n=st.need[r]; if(!n) continue; const f=(n-(+C.have[r]||0))/n; if(f>bv+.001){bv=f;best=r;} } return best; }
let gained={};
function grant(res, base, noBoost){
  let m=noBoost?1:1+boostPct(); if(!noBoost&&res===scarce()) m*=1.25;
  const amt=base*m; let n=Math.floor(amt); if(Math.random()<amt-n) n++;
  if(n>0){ S.res[res]+=n; if(!noBoost){ S.mined[res]+=n; S.shared+=n*.1; S.unsynced[res]=(S.unsynced[res]||0)+n; } gained[res]=(gained[res]||0)+n; bump(res); }
  return n;
}
function flushGained(prefix=''){ const parts=Object.entries(gained).map(([r,n])=>`+${n} ${RNAME[r]}`); gained={}; if(parts.length) toast(prefix+parts.join(' · ')); }
function addXP(n){ S.xp+=n; let need=30+S.level*20; while(S.xp>=need){ S.xp-=need; S.level++; S.unspent+=1; lyra(`Level ${S.level}. You've earned an attribute point. Spend it on your crew card in the Dashboard. Points are permanent, so choose the crew member you want to be.`,{prio:4,celebrate:true}); need=30+S.level*20; } }
function costOf(b){ const f=1-.06*(S.attrs.fab-1); const c={}; for(const [r,v] of Object.entries(b.cost)) c[r]=Math.max(1,Math.round(v*f)); return c; }
const canPay=c=>Object.entries(c).every(([r,v])=>S.res[r]>=v);
const pay=c=>{for(const [r,v] of Object.entries(c)) S.res[r]-=v;};

function rigRates(rg){
  const cnt={};
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ const r=ROCKRES[tile(rg.x+dx,rg.y+dy)]; if(r) cnt[r]=(cnt[r]||0)+1; }
  const keys=Object.keys(cnt); if(!keys.length) return {};
  const prim=keys.reduce((a,b)=>cnt[b]>cnt[a]?b:a);
  const out={}; const geo=1+.1*(S.attrs.geo-1);
  for(const k of keys) out[k]= k===prim ? 5 : 1*geo;
  if(prim==='rare') out.rare=1.5;
  return out;
}
const rigCapHours=()=>12+3*(S.attrs.end-1);
function rigFill(rg){ const rt=rigRates(rg); const cap=sum(rt)*rigCapHours(); return cap?Math.min(1,sum(rg.st)/cap):0; }
function validateRigs(){ S.rigs=S.rigs.filter(rg=>tile(rg.x,rg.y)===RIG); }

function advance(min, live){
  if(min<=0) return;
  S.gameMin+=min; const h=min/60;
  for(const rg of S.rigs){
    const rt=rigRates(rg); const rate=sum(rt); if(!rate) continue;
    const cap=rate*rigCapHours(); const room=cap-sum(rg.st); if(room<=0) continue;
    const f=Math.min(1,room/(rate*h));
    for(const [r,v] of Object.entries(rt)) rg.st[r]=(rg.st[r]||0)+v*h*f;
    if(live&&!rg.full&&rigFill(rg)>=.995){ rg.full=true; lyra(`Your auto-drill at ${(rg.y-GY+1)*2} m is full. Press C or tap it to collect.`,{prio:2,key:'rigfull',cool:300}); }
  }
  let g=countMine(GREEN,true);
  if(g){ S.foodFrac+=g*h; const n=Math.floor(S.foodFrac); if(n>0){ S.foodFrac-=n; S.res.food+=n; S.mined.food+=n; S.unsynced.food=(S.unsynced.food||0)+n; } }
  S.training.min+=min;
  while(S.training.min>=480){ S.training.min-=480; const a=ATTRS.find(x=>x.k===S.training.attr); S.attrs[a.k]++; lyra(`Training complete: ${a.n} is now ${S.attrs[a.k]}. It keeps training unless you pick something else.`,{prio:3,celebrate:true}); }
}
function collectRigs(){
  let any=false;
  for(const rg of S.rigs){ for(const [r,v] of Object.entries(rg.st)){ if(v>=.5){ grant(r,v); any=true; } } rg.st={}; rg.full=false; }
  if(any){ S.collected++; addXP(3); chime([523,659,784]); flushGained('Auto-drills: '); checkMissions(); } else toast('Your auto-drills are still filling. Give them some time.');
}

// ---------- the colony (via the site) ----------
let giving=false;
function contribute(res, half){
  const st=stage(); if(!st||giving) return;
  const need=st.need[res]-(+C.have[res]||0); if(need<=0) return;
  const mult=1+.1*(S.attrs.spirit-1);
  const have=Math.floor(S.res[res]*(half?.5:1)); if(have<1){ toast(`You have no ${RNAME[res]} to send yet.`); return; }
  const credited=Math.min(need, have*mult);
  giving=true; post({type:'contribute', res, amount: Math.round(credited*100)/100, mult});
  setTimeout(()=>{ giving=false; },8000);
}
function onContributed(m){
  giving=false;

  const mult=1+.1*(S.attrs.spirit-1);
  const give=Math.min(Math.floor(S.res[m.res]), Math.ceil((+m.accepted||0)/mult));
  if(give>0){
    S.res[m.res]-=give; S.given+=give; addXP(Math.ceil(give/5)); beep(330,.18,'triangle',.06,660);
    toast(`Sent ${give} ${RNAME[m.res]} to the ${STAGES[C.stage]?STAGES[C.stage].n:'colony'}.`);
    if(S.daily&&!S.daily.done&&S.daily.res===m.res){ S.daily.given+=give; if(S.daily.given>=S.daily.target){ S.daily.done=true; S.boosts.push({label:"Answered Lyra's colony call",pct:.10,until:Date.now()+86400000,mode:'Kinship'}); addXP(15); lyra("That covers today's call. The colony noticed, and so did I: +10% on everything you mine for the next day.",{prio:5,celebrate:true}); } }
  }
  if(m.colony) setColony(m.colony);
  checkMissions(); renderDash(); save(true);
}
function setColony(col, myDelta){
  if(!col) return;
  const prev=C.stage;
  C={stage:col.stage|0, have:col.have||{}, mined:col.mined||{}};
  if(C.stage>prev){ const done=STAGES[prev]; lyra(done?`The ${done.n} is complete. Every crew on Mars helped build it.${STAGES[C.stage]?` Next: the ${STAGES[C.stage].n}.`:' The Launch Facility is ready. Season 2 opens the solar system.'}`:'',{prio:6,celebrate:true,hold:true}); }
  // the Commons: 10% of what everyone else mined since our last check-in

    const got={};
    for(const r of RES){
      const others=((+C.mined[r]||0)-(+S.cSnap[r]||0))-((myDelta&&myDelta[r])||0);
      if(others<=0) continue;
      S.commonsFrac[r]=(S.commonsFrac[r]||0)+others*.1;
      const n=Math.floor(S.commonsFrac[r]); if(n>0){ S.commonsFrac[r]-=n; S.res[r]+=n; got[r]=n; bump(r); }
    }
    const parts=Object.entries(got).map(([r,n])=>`${n} ${RNAME[r]}`);

  }

}
function setCrews(list){

  crews=(list||[]).filter(c=>c.username!==ME.username);
  for(const c of crews){ const active=Date.now()-new Date(c.updated_at)<10*60000; if(active&&!before.has(c.username)&&connected&&phase==='play') lyra(`${c.username} is on Mars right now.`,{prio:1,key:'crew-'+c.username,cool:1800}); }
}
function setLog(list){

// ---------- player ----------
const P = {rx:S.px, ry:S.py, fx:0, fy:1, move:null, drill:null, dsnd:0};
const held = {up:false,down:false,left:false,right:false}; const order=[];
function curDir(){ for(let i=order.length-1;i>=0;i--) if(held[order[i]]) return order[i]; return null; }
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function setHeld(d,on){ held[d]=on; if(on){ const i=order.indexOf(d); if(i>=0) order.splice(i,1); order.push(d);} }
let lastVeinNote=0;
function reveal(){
  const R=2+S.attrs.nav;
  for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dy*dy>R*R+1) continue;

  if(dash.hidden) return;
  const st=stage(), tr=ATTRS.find(a=>a.k===S.training.attr), xpNeed=30+S.level*20;
  const rigs=S.rigs.map((rg,i)=>{ const rt=rigRates(rg); const ks=Object.keys(rt).sort((a,b)=>rt[b]-rt[a]); const f=rigFill(rg); return `<div><div class="kv"><span class="lbl">Drill ${i+1} · ${(rg.y-GY+1)*2} m</span><span>${ks.length?ks.map(k=>`${RNAME[k]} ${rt[k].toFixed(1)}/h`).join(', '):'No rock nearby'}</span><span>${Math.round(f*100)}%</span></div><div class="meter ${f>=.99?'warm':''}"><i style="width:${f*100}%"></i></div></div>`; }).join('');
  const boosts=allBoosts();
  const activeCrews=crews.filter(c=>Date.now()-new Date(c.updated_at)<15*60000);
  dash.innerHTML=`
  <div class="dhead"><div><p class="eyebrow mono">SpaceCore crew · Level ${S.level}</p><h2>${esc(ME.username)}</h2></div><button class="btn" type="button" data-act="close">Close</button></div>
  <section><div class="kv"><span class="lbl">Experience</span><span></span><span>${S.xp} / ${xpNeed}</span></div><div class="meter"><i style="width:${S.xp/xpNeed*100}%"></i></div></section>
  <section><h3>Crew card</h3>
    <p class="small">${S.unspent?`You have <b style="color:var(--warm)">${S.unspent-pendTotal()}</b> ${S.unspent-pendTotal()===1?'point':'points'} to spend. Once you lock them in, they're permanent.`:'You earn one point each level. Training adds points over time too.'}</p>
    <div class="attrs">${ATTRS.map(a=>`<div class="acard"><div class="an">${a.n}</div><div class="ae">${a.e}</div>${pipsHTML(S.attrs[a.k],pend[a.k]||0)}<div class="pm"><span>${S.attrs[a.k]}${pend[a.k]?` +${pend[a.k]}`:''}</span>${S.unspent>pendTotal()?`<button type="button" data-act="pend" data-a="${a.k}" aria-label="Add a point to ${a.n}">+</button>`:''}</div></div>`).join('')}</div>
    ${pendTotal()?`<div class="row"><button class="btn primary" type="button" data-act="lock">${dash.dataset.c?'Permanent. Confirm':'Lock in '+pendTotal()+' point'+(pendTotal()>1?'s':'')}</button><button class="btn" type="button" data-act="clearpend">Undo</button></div>`:''}
  </section>
  <section><h3>Lyra's missions</h3>
    <div class="mlist">${MISSIONS.map((m,i)=>`<div class="mitem ${i<S.mission?'done':i===S.mission?'cur':''}"><span class="ck">${i<S.mission?'✓':i===S.mission?'›':'·'}</span><span>${m.n}: ${m.d}${i===S.mission&&m.prog?` (${m.prog()})`:''}</span></div>`).join('')}</div>
    ${!MISSIONS[S.mission]&&S.daily?`<p class="small">Today's colony call: send ${S.daily.target} ${RNAME[S.daily.res]} (${Math.min(S.daily.given,S.daily.target)}/${S.daily.target})${S.daily.done?' · done':''}</p>`:''}
  </section>
  <section><h3>Training</h3>
    <p class="small">One skill trains at a time, even while you're away. Every 8 hours on Mars it gains a permanent point.</p>
    <div class="chips">${ATTRS.map(a=>`<button type="button" class="btn sm ${a.k===S.training.attr?'on':''}" data-act="train" data-a="${a.k}">${a.n}</button>`).join('')}</div>
    <div class="kv"><span class="lbl">${tr.n}</span><span></span><span>${fmtH(S.training.min)} of 8h</span></div><div class="meter warm"><i style="width:${S.training.min/480*100}%"></i></div>
  </section>
  <section><h3>Auto-drills</h3>
    ${S.rigs.length?rigs:'<p class="small">No auto-drills yet. Press B, choose Auto-drill (7) and tap a tunnel spot you dug that touches rock.</p>'}
    <p class="small">Each holds ${rigCapHours()} Mars hours of mining (Endurance raises that). Mars time runs ${TIME_SCALE}× real time during Alpha.</p>
    <div class="row"><button class="btn primary" type="button" data-act="collect" ${S.rigs.length?'':'disabled'}>Collect all</button>${ME.sentinel?'<button class="btn" type="button" data-act="overnight">Skip ahead 8 Mars hours (Sentinel)</button>':''}</div>
  </section>
  <section><h3>Colony</h3>
    ${st?`<p><b>${st.n}</b> <span class="tag">Great Work ${C.stage+1} of ${STAGES.length}</span></p>
    ${['iron','silicon','ice','rare'].filter(r=>st.need[r]).map(r=>{ const h=Math.floor(+C.have[r]||0), n=st.need[r]; return `<div><div class="kv"><span class="lbl">${RNAME[r]}</span><span>${h} / ${n}</span><span class="row" style="gap:4px"><button type="button" class="btn sm" data-act="give" data-half="1" data-r="${r}" ${h>=n||S.res[r]<2||giving?'disabled':''}>Half</button><button type="button" class="btn sm" data-act="give" data-r="${r}" ${h>=n||S.res[r]<1||giving?'disabled':''}>All</button></span></div><div class="meter"><i style="width:${h/n*100}%;background:${RCOL[r]}"></i></div></div>`; }).join('')}
    ${scarce()?`<p class="small">The colony is shortest on ${RNAME[scarce()]}, so mining it pays 25% more right now.</p>`:''}`:'<p>All five Great Works are complete. Season 2 opens the solar system.</p>'}
    <p class="small">${crews.length+1} Kin on Mars${activeCrews.length?` · here now: ${activeCrews.map(c=>esc(c.username)).join(', ')}`:''}</p>
    <div class="list">${colonyLog.slice(0,8).map(l=>`<span>${esc(l.text)}</span>`).join('')||'<span>No colony news yet.</span>'}</div>
  </section>
  <section><h3>Boosts</h3>
    ${boosts.length?`<div class="list">${boosts.map(b=>`<span>${esc(b.label)} · +${Math.round(b.pct*100)}% · ${fmtReal(b.until-Date.now())} left</span>`).join('')}</div>`:'<p class="small">No active boosts.</p>'}
    <p class="small">What you do elsewhere on 13i.space powers your drills here (capped at +50% in total):</p>
    <div class="list">${BOOST_WAYS.map(([m,what,amt,href])=>`<span>${m} · <a href="${href}" target="_top">${what}</a> · ${amt}</span>`).join('')}</div>
  </section>
  <section><h3>Ledger</h3>
    <div class="kv">${RES.map(r=>`<span class="lbl">${RNAME[r]} mined</span><span></span><span>${S.mined[r]}</span>`).join('')}
    <span class="lbl">Sent to Great Works</span><span></span><span>${S.given}</span>
    <span class="lbl">Shared with all Kin</span><span></span><span>${Math.floor(S.shared)}</span>
    <span class="lbl">Deepest</span><span></span><span>${S.maxDepth*2} m</span></div>
    <p class="fine">10% of everything each Kin mines reaches every other Kin as the Commons dividend. It never comes out of anyone's share.</p>
  </section>`;
}
dash.addEventListener('pointerdown',()=>{dashBusy=true;});
dash.addEventListener('click',e=>{
  setTimeout(()=>{dashBusy=false;},0);
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='close'){ dash.hidden=true; return; }
  if(a==='pend'){ if(S.unspent-pendTotal()>0){ pend[b.dataset.a]=(pend[b.dataset.a]||0)+1; delete dash.dataset.c; beep(600,.05);} }
  if(a==='clearpend'){ pend={}; delete dash.dataset.c; }
  if(a==='lock'){ if(!dash.dataset.c){ dash.dataset.c='1'; } else { for(const [k,v] of Object.entries(pend)) S.attrs[k]+=v; S.unspent-=pendTotal(); pend={}; delete dash.dataset.c; chime([523,659,784]); toast('Points locked in.','big'); renderPalette(true); save(true); } }
  if(a==='train'){ if(S.training.attr!==b.dataset.a){ S.training={attr:b.dataset.a,min:0}; toast('Training switched. Progress starts fresh.'); } }
  if(a==='collect') collectRigs();
  if(a==='overnight'){ advance(480,true); toast('Skipped ahead 8 hours on Mars.'); }
  if(a==='give') contribute(b.dataset.r, !!b.dataset.half);
  renderDash();
});
function toggleDash(){ if(phase!=='play') return; dash.hidden=!dash.hidden; renderDash(); }
$('#btnDash').onclick=toggleDash;
$('#btnSound').onclick=()=>{ soundOn=!soundOn; $('#btnSound').textContent=soundOn?'Sound on':'Sound off'; if(soundOn) ac(); };

// ---------- fullscreen ----------
async function toggleFull(){
  const d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
  const el=d.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req&&(d.fullscreenEnabled||d.webkitFullscreenEnabled)){ try{ await req.call(el); return; }catch(e){} }
  post({type:'pseudoFullscreen'});
}
$('#btnFull').onclick=toggleFull;
const fsLabel=()=>{ $('#btnFull').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'Exit fullscreen':'Fullscreen'; };
document.addEventListener('fullscreenchange',fsLabel); document.addEventListener('webkitfullscreenchange',fsLabel);

// ---------- input ----------
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(phase!=='play') return;
  const d=KMAP[e.code]; if(d){ setHeld(d,true); e.preventDefault(); return; }
  if(e.code==='KeyB') setMode(mode==='dig'?'build':'dig');
  else if(e.code==='KeyC'&&S.rigs.length) collectRigs();
  else if(e.code==='KeyQ') scan();
  else if(e.code==='KeyF') toggleFull();
  else if(e.code==='Tab'){ e.preventDefault(); toggleDash(); }
  else if(e.code==='Escape'){ dash.hidden=true; setMode('dig'); }
  else { const n=parseInt(e.key,10); if(n>=1&&n<=BUILD.length) selectBuild(BUILD[n-1].id); }
});
addEventListener('keyup',e=>{ const d=KMAP[e.code]; if(d) setHeld(d,false); });
addEventListener('blur',()=>{ for(const k in held) held[k]=false; });
document.querySelectorAll('#dpad button').forEach(b=>{
  const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); setHeld(d,true); try{b.setPointerCapture(e.pointerId);}catch(err){} });
  for(const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev,()=>setHeld(d,false));
});
function cellAt(e){ const r=cv.getBoundingClientRect(); return {x:Math.floor((e.clientX-r.left+cam.x)/T), y:Math.floor((e.clientY-r.top+cam.y)/T)}; }
cv.addEventListener('pointermove',e=>{ hover=cellAt(e); });
cv.addEventListener('pointerleave',()=>{ hover=null; });
cv.addEventListener('pointerdown',e=>{ if(phase!=='play') return; ac(); const c=cellAt(e); hover=c; if(mode==='build') tryBuild(c.x,c.y); else if(tile(c.x,c.y)===RIG&&own[idx(c.x,c.y)]===1) collectRigs(); });

// ---------- saving and syncing (through the 13i.space page around this one) ----------
function summary(){
  return {level:S.level, xp:S.xp, xpNeed:30+S.level*20, unspent:S.unspent, attrs:S.attrs,
    rigs:S.rigs.map(rg=>{ const rt=rigRates(rg); return {fill:rigFill(rg), rate:sum(rt), cap:sum(rt)*rigCapHours(), depth:(rg.y-GY+1)*2}; }),
    training:{attr:S.training.attr, min:S.training.min}, mission:{i:S.mission, total:MISSIONS.length, name:MISSIONS[S.mission]?MISSIONS[S.mission].n:null},
    given:S.given, mined:S.mined, maxDepth:S.maxDepth*2, rooms:countMine(O2,true), lastReal:Date.now(), timeScale:TIME_SCALE};
}
let lastSave=0;
function save(now){
  if(!connected||!S.introDone||phase!=='play') return;
  if(!now&&Date.now()-lastSave<15000) return;
  lastSave=Date.now(); S.lastReal=Date.now();
  let s=''; for(let i=0;i<seen.length;i++) s+=seen[i]?'1':'0';
  S.seen=s; S.name=ME.username;
  post({type:'save', state:S, summary:summary(), px:S.px, py:S.py});
}
function flushTiles(){
  if(!connected||!pending.size) return;
  const changes=[]; for(const [i,t] of pending){ changes.push([i%W,(i/W)|0,t]); if(changes.length>=400) break; }
  for(const [x,y] of changes) pending.delete(idx(x,y));
  post({type:'tiles', changes});
}
function requestSync(){
  if(!connected) return;
  const mined=S.unsynced; S.unsynced={};
  post({type:'sync', mined});
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); flushTiles(); save(true); }
  else if(hiddenAt&&phase==='play'){ const real=Date.now()-hiddenAt; if(real>5000){ advance(real/60000*TIME_SCALE,true); toast(`${fmtH(real/60000*TIME_SCALE)} passed on Mars while you were away.`); requestSync(); } hiddenAt=0; }
});
addEventListener('pagehide',()=>{ flushTiles(); save(true); });

window.addEventListener('message',e=>{
  if(e.origin!==window.location.origin||e.source!==window.parent) return;
  const m=e.data||{}; if(m.source!=='13i-site') return;
  if(m.type==='init'){
    ME={username:m.user.username, sentinel:!!m.user.sentinel};
    ownerNames=m.owners||[];
    applyTiles(m.tiles||[], false);
    if(m.state&&m.state.v===2){ S=Object.assign(fresh(),m.state); const s=S.seen||''; for(let i=0;i<Math.min(s.length,seen.length);i++) seen[i]=s.charCodeAt(i)===49?1:0; }
    S.name=ME.username; validateRigs(); recomputePressure();
    if(m.colony) C={stage:m.colony.stage|0, have:m.colony.have||{}, mined:m.colony.mined||{}};
    setColony(m.colony);
    setCrews(m.crews); setLog(m.log); siteBoosts=m.boosts||[];
    P.rx=S.px; P.ry=S.py;
    connected=true;
    if(siteBoosts.length&&S.introDone) setTimeout(()=>lyra(`Your activity on 13i.space is powering your drills: ${siteBoosts.map(b=>`${b.label} (+${Math.round(b.pct*100)}%)`).join(', ')}.`,{prio:2}),9000);
    setPhase('title');
  } else if(m.type==='world'){
    ownerNames=m.owners||ownerNames;
    applyTiles(m.tiles||[], true);
    setColony(m.colony, m.myMined);
    setCrews(m.crews); setLog(m.log);
    if(m.boosts) siteBoosts=m.boosts;
    dailyCall(false); renderDash();
  } else if(m.type==='contributed'){ onContributed(m); }
  else if(m.type==='error'){ toast(m.text||'Something went wrong talking to the colony.'); }
  else if(m.type==='signedOut'){ connected=false; showWait('Your session ended. Sign in again on 13i.space to keep playing.'); phase='offline'; }
});

// ---------- loop ----------
let lastT=performance.now(), time=0, saveAcc=0, slowAcc=0, tileAcc=0, syncAcc=0, giftAcc=0, hiddenAt=0;
function lyraGift(){
  if(S.gifts.day!==today()) S.gifts={day:today(),n:0};
  if(S.gifts.n>=3||Math.random()>.35) return;
  S.gifts.n++;
  const pct=.03+Math.round(Math.random()*5)/100;
  S.boosts=S.boosts.filter(b=>b.label!=="Lyra's gift"); S.boosts.push({label:"Lyra's gift",pct,until:Date.now()+2*3600000,mode:'Lyra'});
  lyra(pick([`Good digging. Here's a little extra: +${Math.round(pct*100)}% for the next two hours.`,`I tuned your drill while you weren't looking. +${Math.round(pct*100)}% for two hours.`,`The colony's running smooth today. Take +${Math.round(pct*100)}% on me, for two hours.`]),{prio:2,celebrate:true});
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000); lastT=now; time+=dt; phaseT+=dt;
  if(phase==='play'){
    updatePlayer(dt); advance(dt/60*TIME_SCALE,true); tickLyra(dt);
    if(scanCool>0) scanCool-=dt;
    saveAcc+=dt; if(saveAcc>15){ saveAcc=0; save(true); }
    tileAcc+=dt; if(tileAcc>3){ tileAcc=0; flushTiles(); }
    syncAcc+=dt; if(syncAcc>25){ syncAcc=0; requestSync(); }
    giftAcc+=dt; if(giftAcc>240){ giftAcc=0; lyraGift(); }
    slowAcc+=dt; if(slowAcc>.25){ slowAcc=0; updateRes(); updateStatus(); if(mode==='build') renderPalette(); $('#lyraMission').textContent=missionLine(); if(!lyraCur) lyraText.innerHTML=missionLine(true); if(!dash.hidden&&!dashBusy&&Math.floor(time)%2===0&&Math.floor(time)!==dash._t){ dash._t=Math.floor(time); renderDash(); } }
    drawGame(time,dt);
  } else drawIntro(time,dt);
  requestAnimationFrame(frame);
}
if(inFrame){ showWait('Contacting the colony…'); post({type:'ready'}); setTimeout(()=>{ if(!connected) showWait('Still waiting for 13i.space to answer. If this stays, reload the page.'); },8000); }
else { phase='offline'; showWait('SpaceCore runs inside 13i.space. Open it from <a href="/create/spacecore">Create › SpaceCore</a> while signed in.'); }
requestAnimationFrame(frame);
})();
</script>
