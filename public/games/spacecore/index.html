<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpaceCore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* SpaceCore, Mission One: Mars (v2, Update 5.40). One-screen game: HUD bar, side view of the shared Mars world, tool tray.
   Hosted by app/(site)/create/spacecore via components/SpaceCoreGame.js. */
:root{
  --bg:#0A0B1C; --panel:#111330; --line:#262A55; --line2:#3A3E75;
  --lav:#B9C0FF; --lav2:#8B95F6; --warm:#E8CFC0; --muted:#8A8FBF; --dim:#565B8F; --text:#DCDFFF; --rust:#C97B6E; --ok:#9CCB98;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lav2);outline-offset:2px}
a{color:var(--lav)}
.mono{font-family:var(--mono)}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-style:italic;font-weight:600;font-size:22px;color:var(--warm)}
.brand span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
.res{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;background:var(--panel);transition:border-color .2s}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip.bump{border-color:var(--warm)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--line2);border-radius:4px;color:var(--lav);font-family:var(--mono);font-size:12px;padding:6px 12px;letter-spacing:.3px}
.btn:hover{border-color:var(--lav2);background:rgba(139,149,246,.08)}
.btn.primary{border-color:var(--warm);color:var(--warm)}
.btn.primary:hover{background:rgba(232,207,192,.1)}
.btn.on{background:rgba(139,149,246,.16);border-color:var(--lav2);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:3px 8px;font-size:11px}
#stage{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#06060f}
#cv{display:block;width:100%;height:100%;touch-action:none}
.tools{display:flex;flex-direction:column;gap:6px}
.toolrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.modes{display:flex;gap:4px}
.palette{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.pitem{display:flex;align-items:center;gap:7px;padding:4px 9px 4px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);text-align:left}
.pitem canvas{width:22px;height:22px;border-radius:2px;flex:0 0 22px}
.pitem span{display:flex;flex-direction:column;gap:1px}
.pitem b{font-weight:500;font-size:12px}
.pitem small{font-family:var(--mono);font-size:10px;color:var(--muted)}
.pitem.sel{border-color:var(--warm);background:rgba(232,207,192,.08)}
.pitem.poor small{color:var(--rust)}
.pitem.none{opacity:.55}
.status{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.status em{font-style:normal;color:var(--warm)}
#toasts{position:absolute;right:12px;top:118px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;max-width:min(360px,calc(100% - 24px))}
.toast{background:rgba(10,11,28,.88);border:1px solid var(--line2);border-radius:4px;padding:7px 11px;font-family:var(--mono);font-size:12px;color:var(--text);transition:opacity .5s}
.toast.big{border-color:var(--warm);color:var(--warm)}
#dpad{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
#dpad button{background:rgba(17,19,48,.8);border:1px solid var(--line2);border-radius:6px;color:var(--lav);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
#dpad button:active{background:rgba(139,149,246,.25)}
@media (hover:hover) and (pointer:fine) and (min-width:760px){#dpad{display:none}}

/* the borer's instrument cluster */
#gauges{position:absolute;left:12px;top:12px;width:228px;background:rgba(10,11,28,.86);border:1px solid var(--line2);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--muted);pointer-events:none}
.g{display:grid;grid-template-columns:58px 1fr 62px;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.gl{letter-spacing:1.2px;font-size:9.5px}
.gbar{height:6px;background:var(--line);border-radius:2px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--lav2);transition:width .15s linear}
.gv{text-align:right;color:var(--text)}
.gfoot{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:5px;font-size:10px}
.gfoot em{font-style:normal;color:var(--warm)}
#mini{position:absolute;right:12px;top:12px;width:256px;height:100px;border:1px solid var(--line2);border-radius:4px;background:#05050d;image-rendering:pixelated;cursor:pointer}
#mini.small{width:150px;height:59px}

/* Lyra on comms */
#lyra{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px;max-width:min(430px,calc(100% - 190px));pointer-events:none}
@media (hover:hover) and (pointer:fine) and (min-width:760px){#lyra{max-width:min(460px,calc(100% - 24px))}}
#lyra > *{pointer-events:auto}
.orb{width:52px;height:52px;flex:0 0 52px;border:none;background:none;padding:0;border-radius:50%}
.orb svg{width:100%;height:100%;overflow:visible}
.orb .halo{transition:opacity .4s}
#lyra.speaking .orb .ring{animation:spin 6s linear infinite;transform-origin:26px 26px}
#lyra.speaking .orb .halo{opacity:.9}
#lyra.celebrate .orb .halo{fill:rgba(232,207,192,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.lyra-body{background:rgba(10,11,28,.93);border:1px solid var(--lav2);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.lyra-name{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--lav2);display:flex;justify-content:space-between;gap:8px}
.lyra-text{font-size:13px;line-height:1.5;color:var(--text);min-height:1.5em}
.lyra-text a{color:var(--warm)}
.lyra-mission{font-family:var(--mono);font-size:11px;color:var(--warm);line-height:1.45}
.lyra-row{display:flex;flex-wrap:wrap;gap:5px}
#lyraAsk{display:flex;gap:5px}
#lyraAsk input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:4px;color:var(--text);font:inherit;font-size:12px;padding:6px 8px}
#lyra.min .lyra-body{display:none}
.lyra-x{background:none;border:none;color:var(--muted);font-size:15px;line-height:1;padding:0 2px;margin-left:4px}
.lyra-x:hover{color:var(--text)}
#lyra.right{left:auto;right:12px;flex-direction:row-reverse}
@media (hover:none),(pointer:coarse),(max-width:759px){#lyra.right{bottom:172px}}
@media (prefers-reduced-motion:reduce){#lyra.speaking .orb .ring{animation:none}.toast{transition:none}.gbar i{transition:none}}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.card{background:rgba(12,13,32,.9);border:1px solid var(--line2);border-radius:4px;padding:22px;max-width:660px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{font-family:var(--display);font-style:italic;font-weight:600;margin:0;color:var(--warm);text-wrap:balance}
.card h1{font-size:clamp(34px,6vw,54px);line-height:1}
.card h2{font-size:26px}
.card p{margin:0;line-height:1.6;max-width:62ch}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--lav2);margin:0}
.scene-label{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:4px}
.count{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(46px,9vw,96px);color:var(--warm);text-shadow:0 2px 24px rgba(0,0,0,.5);pointer-events:none}
.skip{position:absolute;right:16px;bottom:16px}
.scene-label .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fine{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.acard{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:6px;min-width:0}
.acard .an{font-family:var(--display);font-style:italic;font-size:17px}
.acard .ae{font-size:12px;color:var(--muted);line-height:1.4}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:14px;height:6px;border-radius:1px;background:var(--line)}
.pips i.f{background:var(--lav2)}
.pips i.p{background:var(--warm)}
.pm{display:flex;align-items:center;gap:6px;justify-content:space-between}
.pm button{width:28px;height:26px;border:1px solid var(--line2);background:none;border-radius:3px;color:var(--lav)}
.pm span{font-family:var(--mono);font-size:12px;color:var(--muted)}
#dash{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:rgba(12,13,32,.97);border-left:1px solid var(--line2);overflow:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px;z-index:5}
#dash h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:26px;margin:0;color:var(--warm)}
#dash h3{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--lav2);margin:0 0 8px}
#dash section{display:flex;flex-direction:column;gap:6px}
#dash p{margin:0;line-height:1.5;font-size:13px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meter{height:6px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lav2)}
.meter.warm i{background:var(--warm)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.kv .lbl{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.5}
.small{font-size:12px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);border-radius:3px;padding:1px 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.mlist{display:flex;flex-direction:column;gap:5px}
.mitem{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:12.5px;line-height:1.4}
.mitem .ck{font-family:var(--mono);color:var(--dim)}
.mitem.done{color:var(--muted)}
.mitem.done .ck{color:var(--ok)}
.mitem.cur{color:var(--warm)}
.fab{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.fab b{font-weight:500;font-size:13px}
.fab small{font-family:var(--mono);font-size:10.5px;color:var(--muted);grid-column:1}
.fab .act{grid-row:1 / span 2;grid-column:2;display:flex;align-items:center;gap:8px}
.fab .have{font-family:var(--mono);font-size:11px;color:var(--warm)}
@media (max-width:560px){.brand span{display:none}.card{padding:16px}#lyra{max-width:calc(100% - 24px);bottom:auto;top:12px}#gauges{top:auto;bottom:12px;width:170px}.g{grid-template-columns:44px 1fr 46px}#mini{display:none}#toasts{top:auto;bottom:170px}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>SpaceCore</b><span class="mono">Mission One · Mars · Alpha</span></div>
    <div id="res" class="res" aria-live="polite"></div>
    <div class="actions">
      <button id="btnDash" class="btn" type="button">Dashboard</button>
      <button id="btnFull" class="btn" type="button">Fullscreen</button>
      <button id="btnSound" class="btn" type="button">Sound on</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv" aria-label="Side view of Mars: the colony on the surface and the tunnels Kin have dug"></canvas>
    <div id="gauges" hidden>
      <div class="g"><span class="gl">BATTERY</span><span class="gbar"><i id="gBat"></i></span><span class="gv" id="gBatV">100%</span></div>
      <div class="g"><span class="gl">DRILL</span><span class="gbar"><i id="gRpm"></i></span><span class="gv" id="gRpmV">0 rpm</span></div>
      <div class="g"><span class="gl">DRILL °C</span><span class="gbar"><i id="gTmp"></i></span><span class="gv" id="gTmpV">20°</span></div>
      <div class="gfoot"><span id="gOut">Outside −63°C</span><span id="gState">Surface</span></div>
    </div>
    <canvas id="mini" width="512" height="200" hidden title="Map of what you've explored (M to resize)"></canvas>
    <div id="toasts"></div>
    <div id="dpad" hidden>
      <span></span><button type="button" data-d="up" aria-label="Up">▲</button><span></span>
      <button type="button" data-d="left" aria-label="Left">◀</button><span></span><button type="button" data-d="right" aria-label="Right">▶</button>
      <span></span><button type="button" data-d="down" aria-label="Down">▼</button><span></span>
    </div>
    <div id="lyra" hidden>
      <button id="lyraOrb" class="orb" type="button" aria-label="Show or hide Lyra">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle class="halo" cx="26" cy="26" r="24" fill="rgba(139,149,246,.18)" opacity=".5"/>
          <g class="ring"><circle cx="26" cy="26" r="17" fill="none" stroke="#B9C0FF" stroke-width="2" stroke-dasharray="80 10 4 10"/></g>
          <circle cx="26" cy="26" r="11" fill="#14163A" stroke="#8B95F6" stroke-width="1"/>
          <circle cx="26" cy="26" r="4.5" fill="#DCDFFF"/>
        </svg>
      </button>
      <div class="lyra-body">
        <div class="lyra-name"><span>LYRA · COMMS</span><span><span id="lyraCount"></span> <button id="lyraClose" class="lyra-x" type="button" aria-label="Close Lyra's messages" title="Close">×</button></span></div>
        <div id="lyraText" class="lyra-text"></div>
        <div id="lyraMission" class="lyra-mission"></div>
        <div class="lyra-row">
          <button id="lyraNext" class="btn sm" type="button">Got it</button>
          <button id="lyraScan" class="btn sm" type="button">Scan (Q)</button>
          <button id="lyraAskBtn" class="btn sm" type="button">Ask Lyra</button>
        </div>
        <form id="lyraAsk" hidden><input id="lyraQ" maxlength="400" placeholder="Ask about SpaceCore, Mars or 13i" autocomplete="off"><button class="btn sm" type="submit">Send</button></form>
      </div>
    </div>
    <div id="intro" class="overlay"></div>
    <aside id="dash" hidden></aside>
  </main>
  <footer class="tools" id="tools" hidden>
    <div class="toolrow">
      <div class="modes">
        <button type="button" class="btn on" id="mDig">Dig</button>
        <button type="button" class="btn" id="mBuild">Build (B)</button>
      </div>
      <div class="modes" id="groups" hidden>
        <button type="button" class="btn sm on" id="gBlocks">Blocks</button>
        <button type="button" class="btn sm" id="gEquip">Equipment (E)</button>
      </div>
      <div id="status" class="status"></div>
    </div>
    <div id="palette" class="palette" hidden></div>
  </footer>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const dk = document.createElement('canvas'), dctx = dk.getContext('2d');
const GAME = 'spacecore';
const inFrame = window.parent && window.parent !== window;
const post = msg => { try { if (inFrame) window.parent.postMessage(Object.assign({ source: GAME }, msg), window.location.origin); } catch (e) {} };

// ---------- world constants ----------
const W = 512, H = 200, GY = 10;           // GY = first rock row; row GY-1 is the surface you drive on
const SEED = 2027;
const LANDER_X = 252, SPAWN_X = 255;
const TIME_SCALE = 6;                       // Mars minutes per real minute (Alpha)
const AIR=0, TUN=1, REG=2, BAS=3, ICE=4, MET=5, BED=6, FILL=7;
const IRONP=10, GLASS=11, LOCK=12, O2=13, GREEN=14, LAMP=15, RIG=16;
const BRICK=20, BASB=21, HEMA=22, OLIV=23, GYPS=24, ICEB=25, TGLASS=26, ALLOY=27;
const HEATER=30, SCRUB=31, SENSOR=32, REACTOR=33, CHARGER=34;
const EQUIP_T = new Set([O2,GREEN,LAMP,RIG,HEATER,SCRUB,SENSOR,REACTOR,CHARGER]);
const isEquip = t => EQUIP_T.has(t);
const isRockT = t => (t>=REG&&t<=MET) || t===FILL;
const RES = ['iron','silicon','ice','rare','food'];
const RNAME = {iron:'Iron', silicon:'Silicon', ice:'Ice', rare:'Rare metals', food:'Food'};
const RCOL = {iron:'#C97B6E', silicon:'#AEB4D8', ice:'#A7CFE0', rare:'#E2C27A', food:'#9CCB98'};
const ROCKRES = {[REG]:'iron', [BAS]:'silicon', [ICE]:'ice', [MET]:'rare'};
const HARD = {[REG]:.38, [BAS]:.6, [ICE]:.5, [MET]:.95, [FILL]:.22};
const DRAIN = {[REG]:.45, [BAS]:.7, [ICE]:.55, [MET]:1.1, [FILL]:.2};
const ATTRS = [
  {k:'eng', n:'Engineering', e:'Drill speed +12% per point.'},
  {k:'geo', n:'Geology', e:'More by-products and rare finds.'},
  {k:'end', n:'Endurance', e:'Bigger borer battery, and auto-drills hold 3 more hours per point.'},
  {k:'nav', n:'Navigation', e:'Your scanner sees ice and metal veins further away.'},
  {k:'fab', n:'Fabrication', e:'Building and crafting cost 6% less and crafting runs 8% faster per point.'},
  {k:'spirit', n:'Crew Spirit', e:'Your Great Work contributions count 10% more per point.'},
];
// Blocks: building materials from Mars itself. Placed straight from your resources.
const BLOCKS = [
  {id:'brick', tile:BRICK, n:'Sintered brick', cost:{iron:2}, d:'Regolith baked into brick. The classic Mars build.'},
  {id:'basalt', tile:BASB, n:'Basalt block', cost:{silicon:2}, d:'Cut volcanic rock. Grey and heavy.'},
  {id:'hema', tile:HEMA, n:'Hematite block', cost:{iron:3}, d:'The iron oxide that makes Mars red, polished almost black.'},
  {id:'iron', tile:IRONP, n:'Iron plate', cost:{iron:3}, d:'Riveted iron plate.'},
  {id:'oliv', tile:OLIV, n:'Olivine block', cost:{silicon:3}, d:'A green volcanic mineral found all over Mars.'},
  {id:'gyps', tile:GYPS, n:'Gypsum block', cost:{silicon:1, ice:2}, d:'White sulfate stone, left behind by ancient water.'},
  {id:'iceb', tile:ICEB, n:'Ice block', cost:{ice:3}, d:'Frozen water, cut square. Lets light through.'},
  {id:'glass', tile:GLASS, n:'Glass', cost:{silicon:2}, d:'Clear glass. Seals a room and lets light through.'},
  {id:'tglass', tile:TGLASS, n:'Tinted glass', cost:{silicon:2, iron:1}, d:'Amber glass.'},
  {id:'alloy', tile:ALLOY, n:'Alloy panel', cost:{iron:2, rare:1}, d:'Rare-metal alloy. Gold, and it shows.'},
  {id:'fill', tile:FILL, n:'Backfill', cost:{}, d:'Pack rock back into a tunnel you dug. Free.'},
  {id:'remove', tile:-1, n:'Remove', cost:{}, d:'Take back a block (half refund) or equipment (back to your kit).'},
];
// Equipment: crafted in the Fabricator first (takes Mars time), then placed from your kit.
const EQUIPS = [
  {id:'lock', tile:LOCK, n:'Airlock', cost:{iron:3, silicon:2}, min:10, d:'Seals a room but lets you pass through.'},
  {id:'lamp', tile:LAMP, n:'Lamp', cost:{iron:1, silicon:1}, min:10, d:'Lights the dark.'},
  {id:'o2', tile:O2, n:'O₂ pump', cost:{iron:5, silicon:3, ice:3}, min:30, d:'Pressurizes a fully sealed room.'},
  {id:'heater', tile:HEATER, n:'Heater', cost:{iron:4, silicon:2, rare:1}, min:30, d:'Mars sits around −60°C. Warms a sealed room.'},

function genWorld(){
  const r = mulberry32(SEED), w = new Uint8Array(W*H);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    let t;
    if (y<GY) t=AIR;
    else { const d=y-GY; t = d<12 ? REG : d<17 ? (r()<(d-11)/6?BAS:REG) : BAS; }
    if (y>=GY && (x===0||x===W-1||y>=H-2)) t=BED;
    w[idx(x,y)]=t;
  }
  const inside=(x,y)=>x>0&&x<W-1&&y>GY&&y<H-2;
  function blob(type,n,dmin,dmax,smin,smax,xmin=2,xmax=W-2){
    for(let i=0;i<n;i++){
      let x=xmin+Math.floor(r()*(xmax-xmin)), y=GY+dmin+Math.floor(r()*(dmax-dmin));
      const len=smin+Math.floor(r()*(smax-smin));
      for(let k=0;k<len;k++){
        if(inside(x,y)) w[idx(x,y)]=type;
        const d=Math.floor(r()*4); x+=[1,-1,0,0][d]; y+=[0,0,1,-1][d];
      }

  }
  blob(BAS,80,2,12,3,8);
  blob(REG,110,16,170,3,8);
  blob(ICE,110,5,70,4,11);                 // ice everywhere near the surface
  blob(ICE,110,5,140,5,16,2,150);          // the western ice fields
  blob(MET,120,24,185,2,6);                // metal deeper down
  blob(MET,40,12,26,1,3);
  blob(MET,130,20,185,2,8,370,W-2);        // the eastern metal ridge
  // natural caverns: open space nobody has claimed yet
  for(let i=0;i<80;i++){
    const cx=4+Math.floor(r()*(W-8)), cy=GY+8+Math.floor(r()*(H-GY-22)), rx=2+r()*6, ry=1+r()*3.2, icy=cx<150&&r()<.6;
    for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++) for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){
      const dx=(x-cx)/rx, dy=(y-cy)/ry; if(dx*dx+dy*dy<=1+(r()-.5)*.35&&inside(x,y)) w[idx(x,y)]=TUN;
    }
    if(icy) for(let x=Math.floor(cx-rx);x<=cx+rx;x++){ const y=Math.round(cy+ry); if(inside(x,y)&&w[idx(x,y-1)]===TUN) w[idx(x,y)]=ICE; }
  }
  // lava tubes: long, low natural tunnels left by ancient lava flows
  for(let i=0;i<24;i++){
    let x=4+Math.floor(r()*(W-8)), y=GY+14+Math.floor(r()*(H-GY-40)); const dir=r()<.5?-1:1, len=40+Math.floor(r()*120), thick=r()<.5?2:3;

function recomputePressure(){
  press.fill(0); regionOf.fill(-1); rooms=[];
  const vis=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++){
    if(world[i]!==O2||vis[i]) continue;
    const q=[i], cells=[]; vis[i]=1; let sealed=true;
    while(q.length){
      const c=q.pop(); cells.push(c);
      if(cells.length>900){sealed=false;break;}
      const x=c%W, y=(c/W)|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy, t=tile(nx,ny);
        if(t===AIR){sealed=false;continue;}
        const ni=idx(nx,ny);
        if(interior(t)&&!vis[ni]){vis[ni]=1;q.push(ni);}
      }
    }
    if(!sealed) continue;
    const room={id:rooms.length, size:cells.length, heat:0, scrub:0, sensor:0, minY:H, mine:0};
    for(const c of cells){ press[c]=1; regionOf[c]=room.id; const t=world[c]; if(t===HEATER) room.heat++; else if(t===SCRUB) room.scrub++; else if(t===SENSOR) room.sensor++; room.minY=Math.min(room.minY,(c/W)|0); if(own[c]===1) room.mine++; }
    room.habitable=room.heat>0&&room.scrub>0; room.shielded=depthOf(room.minY)>=12;
    rooms.push(room);
  }
  // what's yours, cached so nothing scans the whole world every frame
  const s={press:0, green:0, greenHab:0, heatRoom:0, habitable:0, sensorDeep:0, reactors:[], chargers:[], powered:[]};
  const habRooms=new Set();
  for(let i=0;i<W*H;i++){
    const t=world[i]; if(t<O2||own[i]!==1) continue;
    const rm=press[i]?rooms[regionOf[i]]:null;
    if(t===O2&&rm) s.press++;
    else if(t===GREEN&&rm){ s.green++; if(rm.habitable) s.greenHab++; }
    else if(t===HEATER&&rm) s.heatRoom++;
    else if(t===SENSOR&&rm&&rm.shielded) s.sensorDeep++;
    else if(t===REACTOR) s.reactors.push(i);
    else if(t===CHARGER) s.chargers.push(i);
    if(rm&&rm.habitable) habRooms.add(rm.id);
  }
  s.habitable=habRooms.size;
  for(const c of s.chargers){ const cx=c%W, cy=(c/W)|0; if(s.reactors.some(rr=>Math.max(Math.abs(rr%W-cx),Math.abs(((rr/W)|0)-cy))<=10)) s.powered.push(c); }

}

function lyra(text,{prio=1,hold=false,celebrate=false,key=null,cool=0}={}){
  if(!text) return;
  if(key){ const t=lyraCool[key]; if(t&&Date.now()-t<cool*1000) return; lyraCool[key]=Date.now(); }
  if(lyraQ.some(m=>m.text===text)||(lyraCur&&lyraCur.text===text)) return;

  lyraQ.push({text,prio,hold,celebrate}); lyraQ.sort((a,b)=>b.prio-a.prio);

// ---------- economy ----------

}

// ---------- the borer ----------
const P = {rx:S.px, ry:S.py, fx:0, fy:1, move:null, drill:null, dsnd:0, strain:0, temp:20, rpm:0, over:false, charging:'', lowWarned:false, emptyWarned:false};

let touched=false, arrivalStage=0;

// ---------- launch: countdown, pad, liftoff, staging, injection burn ----------
let L={smoke:[],cues:{}};

function cue(name,at,fn){ if(phaseT>=at&&!L.cues[name]){ L.cues[name]=1; fn(); } }
function setLabel(a,b){ const A=$('#lblA'), B=$('#lblB'); if(A) A.textContent=a; if(B) B.textContent=b||''; }

}

  ctx.fillStyle='#3a3d55'; for(const ex of [-4,0,4]){ ctx.beginPath(); ctx.moveTo(ex*s-1.6*s,-2.5*s); ctx.lineTo(ex*s+1.6*s,-2.5*s); ctx.lineTo(ex*s+2.2*s,0); ctx.lineTo(ex*s-2.2*s,0); ctx.fill(); }

}
function drawPadScene(t,dt,s,time){
  const cx=vw*.5, padTop=vh*.8, holdY=vh*.62;

    ctx.fillStyle='#20282b'; ctx.fillRect(0,ground,vw,vh-ground+20);
    ctx.fillStyle='#4a4f5c'; ctx.fillRect(cx-46*s,ground-6*s,92*s,6*s); ctx.fillStyle='#14161f'; ctx.fillRect(cx-9*s,ground-6*s,18*s,6*s);

    const tx=cx-24*s, tTop=ground-150*s;

    ctx.beginPath(); ctx.moveTo(tx-6*s,ground-6*s); ctx.lineTo(tx-6*s,tTop); ctx.moveTo(tx+6*s,ground-6*s); ctx.lineTo(tx+6*s,tTop);
    for(let y=ground-6*s;y>tTop;y-=12*s){ ctx.moveTo(tx-6*s,y); ctx.lineTo(tx+6*s,y-12*s); ctx.moveTo(tx+6*s,y); ctx.lineTo(tx-6*s,y-12*s); ctx.moveTo(tx-6*s,y); ctx.lineTo(tx+6*s,y); }
    ctx.stroke();

  for(let i=L.smoke.length-1;i>=0;i--){ const q=L.smoke[i]; q.life-=dt; if(q.life<=0){L.smoke.splice(i,1);continue;} q.x+=q.vx*dt; q.gy+=q.vy*dt; q.vx*=.985; q.r+=dt*9*s; const a=Math.min(.55,q.life/q.max*.6); ctx.fillStyle=`rgba(205,205,215,${a})`; ctx.beginPath(); ctx.arc(q.x,ground+q.gy,q.r,0,7); ctx.fill(); }

}
function drawTMI(u,s,time){

function drawLaunch(time,dt){

// ---------- arrival: approach, a smooth orbit insertion, two passes, deorbit, entry ----------
function drawArrival(time,dt){
  const t=phaseT, cx=vw*.55, cy=vh*.52, Rf=Math.min(vw,vh)*.3, A=Rf*1.45, B=Rf*.42;
  const T1=3.2, T2=11.2, T3=12.8, T4=15.4;
  const orbitPos=th=>({x:cx+A*Math.cos(th), y:cy+B*Math.sin(th)});
  const tang=th=>({x:A*Math.sin(th), y:-B*Math.cos(th)});           // direction of travel (θ decreasing)
  const ship=(x,y,v,sc,flame,glow)=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.atan2(v.y,v.x)+Math.PI/2); drawRocket(0,0,sc,flame,glow); ctx.restore(); };
  const site={x:cx+Rf*.12, y:cy+Rf*.24};
  if(t<T1){
    if(arrivalStage<1){ arrivalStage=1; setLabel('Approaching Mars','Day 205 of 210 · braking for orbit'); }
    const k=t/T1, e=k*k*(3-2*k);
    drawStars(time,50*(1-e)+3,0);
    const mx=vw*.86+(cx-vw*.86)*e, my=vh*.5+(cy-vh*.5)*e, R=60+(Rf-60)*e;
    drawMars(mx,my,R,time);
    // a curve that meets the orbit at its left edge, already moving along it
    const j0=orbitPos(Math.PI), j={x:j0.x+(cx-mx)*0, y:j0.y};
    const p0={x:vw*.08,y:vh*.36}, p2=j, p1={x:j.x-vw*.02,y:vh*.36};
    const bx=(1-e)*(1-e)*p0.x+2*(1-e)*e*p1.x+e*e*p2.x, by=(1-e)*(1-e)*p0.y+2*(1-e)*e*p1.y+e*e*p2.y;
    const dv={x:2*(1-e)*(p1.x-p0.x)+2*e*(p2.x-p1.x), y:2*(1-e)*(p1.y-p0.y)+2*e*(p2.y-p1.y)};
    const v= e>.97 ? tang(Math.PI) : dv;
    ship(bx,by,v,.85,false);
  } else if(t<T2){
    if(arrivalStage<2){ arrivalStage=2; setLabel('Mars orbit','Orbit insertion · two passes over Landing Site Alpha'); burnSound(); }
    drawStars(time,3,0);
    const u=(t-T1)/(T2-T1), th=Math.PI-u*Math.PI*4.5;                  // two full orbits, ending low over the site
    const p=orbitPos(th), v=tang(th), behind=Math.sin(th)<0, sc=behind?.6:.82;
    ctx.strokeStyle='rgba(185,192,255,.16)'; ctx.lineWidth=1; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.ellipse(cx,cy,A,B,0,0,7); ctx.stroke(); ctx.setLineDash([]);
    if(behind) ship(p.x,p.y,v,sc,u<.06);
    drawMars(cx,cy,Rf,time,.05);
    if(u>.25){ ctx.fillStyle=`rgba(232,207,192,${.55+Math.sin(time*6)*.4})`; ctx.beginPath(); ctx.arc(site.x,site.y,3,0,7); ctx.fill(); ctx.font="11px 'JetBrains Mono', monospace"; ctx.fillText('LANDING SITE ALPHA',site.x+8,site.y+4); }
    if(!behind) ship(p.x,p.y,v,sc,u<.06);
  } else if(t<T3){
    if(arrivalStage<3){ arrivalStage=3; setLabel('Deorbit burn','Dropping toward Landing Site Alpha'); burnSound(); }
    const k=(t-T2)/(T3-T2), e=k*k*(3-2*k), Z=1+e*6, target={x:vw*.5,y:vh*.62};
    drawStars(time,2,0);
    const Ax=site.x+(target.x-site.x)*e, Ay=site.y+(target.y-site.y)*e;
    ctx.save(); ctx.translate(Ax,Ay); ctx.scale(Z,Z); ctx.translate(-site.x,-site.y); drawMars(cx,cy,Rf,time,0,false); ctx.restore();
    const p0=orbitPos(Math.PI*.5-0), sx=p0.x+(vw*.5-p0.x)*e, sy=p0.y+(vh*.32-p0.y)*e;
    ship(sx,sy,{x:Math.cos(-.4)*(1-e)+0*e,y:.2+e},.82+e*.5,k<.5,e*.6);
  } else {
    if(arrivalStage<4){ arrivalStage=4; setLabel('Entry, descent and landing','Heat shield · 1,600°C'); entrySound(); }
    const k=Math.min(1,(t-T3)/(T4-T3-.2)), e=k*k;
    ctx.fillStyle='#07081a'; ctx.fillRect(0,0,vw,vh);
    drawStars(time,0,20+e*200);
    const R=Rf*(7+e*6), mcy=vh*.62+R*.98-Rf*.0;
    drawMars(vw*.5,mcy,R,time,0,false);
    const g=ctx.createLinearGradient(0,0,0,vh); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(120,50,40,${.3+e*.6})`); ctx.fillStyle=g; ctx.fillRect(0,0,vw,vh);
    const shake=(Math.random()-.5)*4*k;
    drawRocket(vw*.5+shake,vh*.32+e*vh*.1,1.32,false,.6+k*.4);
    if(Math.random()<.85) parts.push({x:vw*.5+(Math.random()-.5)*30,y:vh*.32+e*vh*.1-30,vx:(Math.random()-.5)*60,vy:-120-Math.random()*120,life:.5,c:Math.random()<.5?'#ffcf9a':'#ff8a55'});
    for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.life-=dt; if(q.life<=0){parts.splice(i,1);continue;} q.x+=q.vx*dt; q.y+=q.vy*dt; ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,3,3); }
    if(t>T4) setPhase('landing');
  }
}

let cpts={eng:1,geo:1,end:1,nav:1,fab:1,spirit:1}; const CP=8;

function resume(){
  const awayReal=Math.max(0,Date.now()-S.lastReal);
  const awayMars=Math.min(14*24*60, awayReal/60000*TIME_SCALE);
  S.readyWhileAway=[];
  advance(awayMars,false);
  // the borer recharged if it was parked at a charger, the lander, or in the sun
  const before=S.bat;
  if(nearCharger()) S.bat=batCap(); else if(atLander()) S.bat=Math.min(batCap(),S.bat+awayReal/1000*2.5); else if(S.py===GY-1) S.bat=Math.min(batCap(),S.bat+awayReal/1000*.25);
  P.rx=S.px; P.ry=S.py; cam.x=S.px*T-vw/2; cam.y=S.py*T-vh/2;
  setPhase('play'); reveal();
  if(relocated){
    lyra("While you were away, SpaceCore moved the landing site to a far bigger stretch of Mars: four times wider and twice as deep, with natural caves and lava tubes to explore. Your old tunnels stayed behind, but you kept your level, skills and resources. The crew also sent a relocation kit: an O₂ pump, a greenhouse, an auto-drill and two lamps.",{prio:7,hold:true});
  }
  const fill=S.rigs.length?Math.round(S.rigs.reduce((a,r)=>a+rigFill(r),0)/S.rigs.length*100):null;
  const active=crews.filter(c=>new Date(c.updated_at).getTime()>S.lastReal).map(c=>c.username);
  const bits=[`Welcome back, ${ME.username}. You were away ${fmtReal(awayReal)}, about ${fmtH(awayMars)} on Mars.`];
  if(S.bat>before+1) bits.push(`Your borer charged to ${Math.round(S.bat/batCap()*100)}%.`);
  if(fill!==null) bits.push(`Your auto-drills are ${fill}% full.`);
  if(S.readyWhileAway.length) bits.push(`The Fabricator finished: ${S.readyWhileAway.join(', ')}.`);
  if(active.length) bits.push(`${active.slice(0,3).join(', ')}${active.length>3?` and ${active.length-3} more`:''} ${active.length===1?'was':'were'} down here while you were gone.`);
  const st=stage(); if(st) bits.push(`The ${st.n} is ${Math.floor(stageProgress()*100)}% built.`);
  lyra(bits.join(' '),{prio:6});
  if(MISSIONS[S.mission]) briefMission(); else dailyCall(true);
  S.lastReal=Date.now(); save(true);
}

function swatch(it){
  const c=document.createElement('canvas'); c.width=44; c.height=44; const x=c.getContext('2d');
  x.fillStyle='#170d12'; x.fillRect(0,0,44,44);
  if(it.id==='move'){ x.strokeStyle='#B9C0FF'; x.lineWidth=3; x.beginPath(); x.moveTo(22,8); x.lineTo(22,36); x.moveTo(8,22); x.lineTo(36,22); x.stroke(); x.fillStyle='#B9C0FF'; for(const [a,b2,c,d] of [[22,4,17,10],[22,40,17,34],[4,22,10,17],[40,22,34,17]]){ x.beginPath(); x.moveTo(a,b2); x.lineTo(c,d); x.lineTo(a===22?27:c,a===22?d:27); x.fill(); } }
  else if(it.id==='remove'){ x.strokeStyle='#C97B6E'; x.lineWidth=3; x.beginPath(); x.moveTo(12,12); x.lineTo(32,32); x.moveTo(32,12); x.lineTo(12,32); x.stroke(); }
  else if(it.id==='fill'){ x.fillStyle='#7a4434'; x.fillRect(0,0,44,44); x.fillStyle='#8c5240'; for(let k=0;k<6;k++) x.fillRect((k*13)%38,(k*17)%38,8,6); }
  else if(isEquip(it.tile)) drawEquip(x,it.tile,0,0,44,0,true,null);
  else drawMaterial(x,it.tile,0,0,44,12345);
  return c;
}

    <span class="lbl">Shared with all Kin</span><span></span><span>${Math.floor(S.shared)}</span>
    <span class="lbl">Deepest</span><span></span><span>${S.maxDepth*2} m</span></div>
    <p class="fine">10% of everything each Kin mines reaches every other Kin as the Commons dividend. It never comes out of anyone's share.</p>
  </section>`;
  if(dashFocus){ const el=$('#d-'+dashFocus); if(el) el.scrollIntoView({block:'start'}); dashFocus=null; }
}
dash.addEventListener('pointerdown',()=>{dashBusy=true;});
dash.addEventListener('click',e=>{
  setTimeout(()=>{dashBusy=false;},0);
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='close'){ dash.hidden=true; return; }
  if(a==='pend'){ if(S.unspent-pendTotal()>0){ pend[b.dataset.a]=(pend[b.dataset.a]||0)+1; delete dash.dataset.c; beep(600,.05);} }
  if(a==='clearpend'){ pend={}; delete dash.dataset.c; }
  if(a==='lock'){ if(!dash.dataset.c){ dash.dataset.c='1'; } else { for(const [k,v] of Object.entries(pend)) S.attrs[k]+=v; S.unspent-=pendTotal(); pend={}; delete dash.dataset.c; chime([523,659,784]); toast('Points locked in.','big'); renderPalette(true); save(true); } }
  if(a==='train'){ if(S.training.attr!==b.dataset.a){ S.training={attr:b.dataset.a,min:0}; toast('Training switched. Progress starts fresh.'); } }
  if(a==='collect') collectRigs();
  if(a==='overnight'){ advance(480,true); toast('Skipped ahead 8 hours on Mars.'); }
  if(a==='give') contribute(b.dataset.r, !!b.dataset.half);
  if(a==='craft') craft(b.dataset.id);
  if(a==='cancel'){ const c=S.craft.splice(+b.dataset.i,1)[0]; if(c){ const e=itemById(c.id); for(const [r,v] of Object.entries(costOf(e))) S.res[r]+=v; toast(`Cancelled the ${e.n}. Materials refunded.`); save(true); } }
  if(a==='replay'){ startReplay(); return; }
  if(a==='reset'){ if(!dash.dataset.reset){ dash.dataset.reset='1'; } else { delete dash.dataset.reset; resetCrew(); return; } }
  renderDash();
});
function openDash(section){ if(phase!=='play') return; dash.hidden=false; dashFocus=section||null; renderDash(); }
function toggleDash(){ if(phase!=='play') return; dash.hidden=!dash.hidden; renderDash(); }
$('#btnDash').onclick=toggleDash;
$('#btnSound').onclick=()=>{ soundOn=!soundOn; $('#btnSound').textContent=soundOn?'Sound on':'Sound off'; if(soundOn) ac(); };

// ---------- fullscreen ----------
async function toggleFull(){
  const d=document;
  if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
  const el=d.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req&&(d.fullscreenEnabled||d.webkitFullscreenEnabled)){ try{ await req.call(el); return; }catch(e){} }
  post({type:'pseudoFullscreen'});
}
$('#btnFull').onclick=toggleFull;
const fsLabel=()=>{ $('#btnFull').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'Exit fullscreen':'Fullscreen'; };
document.addEventListener('fullscreenchange',fsLabel); document.addEventListener('webkitfullscreenchange',fsLabel);

// ---------- input ----------
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(phase!=='play') return;
  const d=KMAP[e.code]; if(d){ setHeld(d,true); e.preventDefault(); return; }
  if(e.code==='KeyB') setMode(mode==='dig'?'build':'dig');
  else if(e.code==='KeyE'){ setMode('build'); setGroup(group==='blocks'?'equip':'blocks'); }
  else if(e.code==='KeyX') selectBuild('fill');
  else if(e.code==='KeyR') selectBuild('remove');
  else if(e.code==='KeyV') selectBuild('move');
  else if(e.code==='KeyC'&&S.rigs.length) collectRigs();
  else if(e.code==='KeyQ') scan();
  else if(e.code==='KeyF') toggleFull();
  else if(e.code==='KeyM') mini.classList.toggle('small');
  else if(e.code==='Tab'){ e.preventDefault(); toggleDash(); }
  else if(e.code==='Escape'){ dash.hidden=true; setMode('dig'); }
  else if(/^Digit\d$/.test(e.code)){ const n=+e.code.slice(5); const i=n===0?9:n-1; if(BLOCKS[i]) selectBuild(BLOCKS[i].id); }
});
addEventListener('keyup',e=>{ const d=KMAP[e.code]; if(d) setHeld(d,false); });
addEventListener('blur',()=>{ for(const k in held) held[k]=false; });
document.querySelectorAll('#dpad button').forEach(b=>{
  const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); setHeld(d,true); try{b.setPointerCapture(e.pointerId);}catch(err){} });
  for(const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev,()=>setHeld(d,false));
});
function cellAt(e){ const r=cv.getBoundingClientRect(); return {x:Math.floor((e.clientX-r.left+cam.x)/T), y:Math.floor((e.clientY-r.top+cam.y)/T)}; }
cv.addEventListener('pointermove',e=>{ hover=cellAt(e); });
cv.addEventListener('pointerleave',()=>{ hover=null; });
cv.addEventListener('pointerdown',e=>{ if(phase!=='play') return; ac(); const c=cellAt(e); hover=c; if(mode==='build') tryBuild(c.x,c.y); else if(tile(c.x,c.y)===RIG&&own[idx(c.x,c.y)]===1) collectRigs(); });

// ---------- saving and syncing (through the 13i.space page around this one) ----------
function seenEnc(){ const b=new Uint8Array(Math.ceil(seen.length/8)); for(let i=0;i<seen.length;i++) if(seen[i]) b[i>>3]|=1<<(i&7); let s=''; for(let i=0;i<b.length;i+=4096) s+=String.fromCharCode.apply(null,b.subarray(i,i+4096)); return btoa(s); }
function seenDec(str){ try{ const s=atob(str); for(let i=0;i<s.length;i++){ const v=s.charCodeAt(i); if(!v) continue; for(let k=0;k<8;k++) if(v&(1<<k)){ const j=i*8+k; if(j<seen.length) seen[j]=1; } } }catch(e){} }
function summary(){
  return {level:S.level, xp:S.xp, xpNeed:30+S.level*20, unspent:S.unspent, attrs:S.attrs,
    rigs:S.rigs.map(rg=>{ const rt=rigRates(rg); return {fill:rigFill(rg), rate:sum(rt), cap:sum(rt)*rigCapHours(), depth:depthOf(rg.y)*2}; }),
    training:{attr:S.training.attr, min:S.training.min}, mission:{i:S.mission, total:MISSIONS.length, name:MISSIONS[S.mission]?MISSIONS[S.mission].n:null},
    given:S.given, mined:S.mined, maxDepth:S.maxDepth*2, rooms:my.press, habitable:my.habitable,
    battery:Math.round(S.bat/batCap()*100), atCharger:nearCharger(), craft:S.craft.map(c=>({n:itemById(c.id).n, left:c.left})),
    kit:EQUIPS.filter(e=>S.inv[e.id]).map(e=>({n:e.n, count:S.inv[e.id]})), lastReal:Date.now(), timeScale:TIME_SCALE};
}
let lastSave=0;
function save(now){
  if(!connected||!S.introDone||phase!=='play') return;
  if(!now&&Date.now()-lastSave<15000) return;
  lastSave=Date.now(); S.lastReal=Date.now();
  S.seen=seenEnc(); S.name=ME.username;
  post({type:'save', state:S, summary:summary(), px:S.px, py:S.py});
}
function flushTiles(){
  if(!connected||!pending.size) return;
  const changes=[]; for(const [i,t] of pending){ changes.push([i%W,(i/W)|0,t]); if(changes.length>=400) break; }
  for(const [x,y] of changes) pending.delete(idx(x,y));
  post({type:'tiles', changes});
}
function requestSync(){ if(!connected) return; const mined=S.unsynced; S.unsynced={}; post({type:'sync', mined}); }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); flushTiles(); save(true); }
  else if(hiddenAt&&phase==='play'){ const real=Date.now()-hiddenAt; if(real>5000){ advance(real/60000*TIME_SCALE,true); if(nearCharger()) S.bat=batCap(); toast(`${fmtH(real/60000*TIME_SCALE)} passed on Mars while you were away.`); requestSync(); } hiddenAt=0; }
});
addEventListener('pagehide',()=>{ flushTiles(); save(true); });

// older crews (v1/v2 world) move to the new, bigger site
function migrate(st){
  if(st.v===3) return st;
  const s=Object.assign(fresh(),st);
  s.v=3; s.rigs=[]; s.px=SPAWN_X; s.py=GY-1; s.seen=''; s.craft=[];
  s.inv={o2:1, green:1, rig:1, lamp:2};
  s.bat=100+15*((s.attrs&&s.attrs.end||1)-1);
  relocated=true;
  return s;
}
window.addEventListener('message',e=>{
  if(e.origin!==window.location.origin||e.source!==window.parent) return;
  const m=e.data||{}; if(m.source!=='13i-site') return;
  if(m.type==='init'){
    ME={username:m.user.username, sentinel:!!m.user.sentinel};
    ownerNames=m.owners||[];
    applyTiles(m.tiles||[], false);
    if(m.state&&m.state.v>=2){ S=migrate(m.state); if(S.seen) seenDec(S.seen); }
    S.name=ME.username; S.inv=S.inv||{}; S.craft=S.craft||[];
    if(!S.lockGift){ S.lockGift=true; S.inv.lock=(S.inv.lock||0)+2; } if(S.bat==null) S.bat=batCap();
    recomputePressure(); validateRigs();
    if(m.colony) C={stage:m.colony.stage|0, have:m.colony.have||{}, mined:m.colony.mined||{}};
    setColony(m.colony);
    setCrews(m.crews); setLog(m.log); siteBoosts=m.boosts||[];
    P.rx=S.px; P.ry=S.py;
    connected=true;
    if(siteBoosts.length&&S.introDone) setTimeout(()=>lyra(`Your activity on 13i.space is powering your drills: ${siteBoosts.map(b=>`${b.label} (+${Math.round(b.pct*100)}%)`).join(', ')}.`,{prio:2}),12000);
    setPhase('title');
  } else if(m.type==='world'){
    ownerNames=m.owners||ownerNames;
    applyTiles(m.tiles||[], true);
    setColony(m.colony, m.myMined);
    setCrews(m.crews); setLog(m.log);
    if(m.boosts) siteBoosts=m.boosts;
    dailyCall(false); renderDash();
  } else if(m.type==='contributed'){ onContributed(m); }
  else if(m.type==='saved'){ saveInfo.ok=!!m.ok; saveInfo.err=m.error; if(m.ok) saveInfo.at=Date.now(); else saveTrouble(m.error); }
  else if(m.type==='tilesSaved'){
    if(m.error){ (m.changes||[]).forEach(([x,y,t])=>{ const i=idx(x,y); if(!pending.has(i)) pending.set(i,world[i]); }); saveTrouble(m.error); }
    else if(m.saved<m.sent){ saveInfo.refused+=m.sent-m.saved; if(m.saved===0&&m.sent>=3) saveTrouble('the colony database refused your digging'); }
    else { saveInfo.ok=true; saveInfo.at=Date.now(); }
  }
  else if(m.type==='error'){ toast(m.text||'Something went wrong talking to the colony.'); }
  else if(m.type==='signedOut'){ connected=false; showWait('Your session ended. Sign in again on 13i.space to keep playing.'); phase='offline'; }
});

function saveTrouble(err){
  saveInfo.ok=false; saveInfo.err=err||'unknown error';
  if(!saveInfo.warned){ saveInfo.warned=true; lyra(`Careful: the colony isn't saving your progress right now (${saveInfo.err}). Anything you dig or build may not be there next time. Tell Paul, or check the Alpha forum.`,{prio:7,hold:true}); }
}
function hidePlayUI(){ ['#tools','#dpad','#lyra','#gauges','#mini'].forEach(s=>$(s).hidden=true); dash.hidden=true; }
function startReplay(){ flushTiles(); save(true); hidePlayUI(); replay=true; lyraQ=[]; lyraCur=null; ac(); setPhase('launch'); }
function resetCrew(){
  flushTiles(); hidePlayUI();
  const keepName=ME.username; S=fresh(); S.name=keepName; relocated=false; replay=false;
  post({type:'save', state:S, summary:summary(), px:null, py:null});
  P.rx=S.px; P.ry=S.py; lyraQ=[]; lyraCur=null;
  setPhase('title');
}

// ---------- loop ----------
let lastT=performance.now(), time=0, saveAcc=0, slowAcc=0, tileAcc=0, syncAcc=0, giftAcc=0, miniAcc=0, gaugeAcc=0, hiddenAt=0;
function lyraGift(){
  if(S.gifts.day!==today()) S.gifts={day:today(),n:0};
  if(S.gifts.n>=3||Math.random()>.35) return;
  S.gifts.n++;
  const pct=.03+Math.round(Math.random()*5)/100;
  S.boosts=S.boosts.filter(b=>b.label!=="Lyra's gift"); S.boosts.push({label:"Lyra's gift",pct,until:Date.now()+2*3600000,mode:'Lyra'});
  lyra(pick([`Good digging. Here's a little extra: +${Math.round(pct*100)}% for the next two hours.`,`I tuned your drill while you weren't looking. +${Math.round(pct*100)}% for two hours.`,`The colony's running smooth today. Take +${Math.round(pct*100)}% on me, for two hours.`]),{prio:2,celebrate:true});
}
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000); lastT=now; time+=dt; phaseT+=dt;
  if(phase==='play'){
    updateBorer(dt); advance(dt/60*TIME_SCALE,true); tickLyra(dt);
    if(scanCool>0) scanCool-=dt;
    saveAcc+=dt; if(saveAcc>10){ saveAcc=0; save(true); }
    tileAcc+=dt; if(tileAcc>2){ tileAcc=0; flushTiles(); }
    syncAcc+=dt; if(syncAcc>25){ syncAcc=0; requestSync(); }
    giftAcc+=dt; if(giftAcc>240){ giftAcc=0; lyraGift(); }
    gaugeAcc+=dt; if(gaugeAcc>.1){ gaugeAcc=0; updateGauges();
      // Lyra keeps clear of the borer: she moves to the other side of the screen
      // where you're working: the cursor while building, otherwise just ahead of the drill
      const bx=(P.rx+.5)*T-cam.x+P.fx*T*2.5, fx=(mode==='build'&&hover)?(hover.x+.5)*T-cam.x:bx, right=lyraEl.classList.contains('right');
      if(!right&&fx<vw*.5-T) lyraEl.classList.add('right'); else if(right&&fx>vw*.5+T) lyraEl.classList.remove('right'); }
    miniAcc+=dt; if(miniAcc>.5){ miniAcc=0; drawMini(); }
    slowAcc+=dt; if(slowAcc>.25){ slowAcc=0; updateRes(); updateStatus(); if(mode==='build') renderPalette(); $('#lyraMission').textContent=missionLine(); if(!lyraCur) lyraText.innerHTML=`<span class="small">${esc(missionLine())}</span>`; if(!dash.hidden&&!dashBusy&&Math.floor(time)%2===0&&Math.floor(time)!==dash._t){ dash._t=Math.floor(time); renderDash(); } }
    drawGame(time,dt);
  } else drawIntro(time,dt);
  requestAnimationFrame(frame);
}
if(inFrame){ showWait('Contacting the colony…'); post({type:'ready'}); setTimeout(()=>{ if(!connected) showWait('Still waiting for 13i.space to answer. If this stays, reload the page.'); },8000); }
else { phase='offline'; showWait('SpaceCore runs inside 13i.space. Open it from <a href="/create/spacecore">Create › SpaceCore</a> while signed in.'); }
requestAnimationFrame(frame);
})();
</script>
